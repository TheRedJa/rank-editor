org.gradle.configuration-cache = true

# Cleanroom
# This template only works with Cleanroom 0.7.0 and above
cleanroom_version = 0.7.11-alpha

# Mod Information
# SINGLE SOURCE OF TRUTH for the version. Injected into mcmod.info and @Mod via Token Envoy and
# used for the jar name (rankeditor-<version>.jar). Keep the stage suffix (-beta) until a stable release is decided.
mod_version = 0.2.0-beta
root_package = com.theredja.rankeditor
mod_id = rankeditor
mod_name = Rank Editor
mod_description = Rank and permission editor addon for FTB Utilities.
mod_authors = TheRedJa
mod_url = https://github.com/TheRedJa/rank-editor
mod_credits =
mod_logo_path =
mod_update_json =

# Run Configurations
# Delimit multiple JVM arguments with spaces
minecraft_username = Developer
extra_jvm_args =
