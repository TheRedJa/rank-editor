name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # Caches the Gradle distribution, dependencies and the deobfuscated Minecraft/FTB jars.
      - uses: gradle/actions/setup-gradle@v6

      # Compiles main and test sources, runs the JUnit suite and builds the mod jar.
      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: rankeditor-jar
          path: build/libs/rankeditor-*.jar
          if-no-files-found: error
